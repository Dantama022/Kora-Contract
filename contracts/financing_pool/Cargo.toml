[package]
name = "kora-financing-pool"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
kora-shared = { path = "../shared" }
kora-invoice-nft = { path = "../invoice_nft" }
kora-risk-registry = { path = "../risk_registry" }
kora-access-control = { path = "../access_control" }
kora-price-oracle = { path = "../price_oracle" }
kora-treasury = { path = "../treasury" }
kora-dispute-resolution = { path = "../dispute_resolution" }
kora-parameter-registry = { path = "../parameter_registry" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
kora-shared = { path = "../shared" }
kora-invoice-nft = { path = "../invoice_nft" }
kora-risk-registry = { path = "../risk_registry" }
kora-access-control = { path = "../access_control" }
kora-price-oracle = { path = "../price_oracle" }
kora-dispute-resolution = { path = "../dispute_resolution" }
kora-parameter-registry = { path = "../parameter_registry" }
proptest = "1.4"

# ── Formal model integration test ─────────────────────────────────────────────
[[test]]
name = "formal_model"
path = "tests/formal_model.rs"
